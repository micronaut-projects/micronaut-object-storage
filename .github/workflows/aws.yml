name: AWS CI
on:
  push:
    branches:
      - master
      - '[1-9]+.[0-9]+.x'
    paths:
      - 'object-storage-aws/**'
      - 'object-storage-core/**'
      - 'object-storage-tck/**'
  workflow_dispatch:
  pull_request:
    branches:
      - master
      - '[1-9]+.[0-9]+.x'
    paths:
      - 'gradle/**'
      - 'object-storage-aws/**'
      - 'object-storage-core/**'
      - 'object-storage-tck/**'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['25']
    steps:
       # https://github.com/actions/virtual-environments/issues/709
      - name: Free disk space
        run: |
         sudo rm -rf "/usr/local/share/boost"
         sudo rm -rf "$AGENT_TOOLSDIRECTORY"
         sudo apt-get clean
         df -h
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'adopt'
          java-version: ${{ matrix.java }}
      - name: Export AWS cloud test credentials
        if: github.event_name != 'pull_request'
        env:
          AWS_ACCESS_KEY_ID_VALUE: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY_VALUE: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
        run: |
          echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID_VALUE" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY_VALUE" >> "$GITHUB_ENV"
          echo "AWS_REGION=$AWS_REGION_VALUE" >> "$GITHUB_ENV"
      - name: Build with Gradle
        run: |
          ./gradlew :micronaut-object-storage-aws:test --no-daemon --parallel --continue
        env:
           TESTCONTAINERS_RYUK_DISABLED: true
           GRADLE_ENTERPRISE_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
           GRADLE_ENTERPRISE_CACHE_USERNAME: ${{ secrets.GRADLE_ENTERPRISE_CACHE_USERNAME }}
           GRADLE_ENTERPRISE_CACHE_PASSWORD: ${{ secrets.GRADLE_ENTERPRISE_CACHE_PASSWORD }}
           PREDICTIVE_TEST_SELECTION: "${{ github.event_name == 'pull_request' && 'true' || 'false' }}"
      - name: Publish Test Report
        if: always()
        uses: mikepenz/action-junit-report@v6.2.0
        with:
          check_name: Java CI / Test Report (${{ matrix.java }})
          report_paths: '**/build/test-results/test/TEST-*.xml'
          check_retries: 'true'
