name: Oracle Cloud CI
on:
  push:
    branches:
      - master
      - '[1-9]+.[0-9]+.x'
    paths:
      - 'object-storage-oracle-cloud/**'
      - 'object-storage-core/**'
      - 'object-storage-tck/**'
  workflow_dispatch:
  pull_request:
    branches:
      - master
      - '[1-9]+.[0-9]+.x'
    paths:
      - 'gradle/**'
      - 'object-storage-oracle-cloud/**'
      - 'object-storage-core/**'
      - 'object-storage-tck/**'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['25']
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
       # https://github.com/actions/virtual-environments/issues/709
      - name: Free disk space
        run: |
         sudo rm -rf "/usr/local/share/boost"
         sudo rm -rf "$AGENT_TOOLSDIRECTORY"
         sudo apt-get clean
         df -h
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'adopt'
          java-version: ${{ matrix.java }}
      - name: Export Oracle Cloud test credentials
        if: github.event_name != 'pull_request'
        run: |
          echo "OCI_FINGERPRINT=${{ secrets.OCI_FINGERPRINT }}" >> "$GITHUB_ENV"
          echo "OCI_PRIVATE_KEY=${{ secrets.OCI_PRIVATE_KEY }}" >> "$GITHUB_ENV"
          echo "OCI_REGION=${{ secrets.OCI_REGION }}" >> "$GITHUB_ENV"
          echo "OCI_TENANT_ID=${{ secrets.OCI_TENANT_ID }}" >> "$GITHUB_ENV"
          echo "OCI_USER_ID=${{ secrets.OCI_USER_ID }}" >> "$GITHUB_ENV"
          echo "ORACLE_CLOUD_TEST_NAMESPACE=${{ secrets.ORACLE_CLOUD_TEST_NAMESPACE }}" >> "$GITHUB_ENV"
          echo "ORACLE_CLOUD_TEST_COMPARTMENT_ID=${{ secrets.ORACLE_CLOUD_TEST_COMPARTMENT_ID }}" >> "$GITHUB_ENV"
      - name: Build with Gradle
        run: |
          ./gradlew :micronaut-object-storage-oracle-cloud:test --no-daemon --parallel --continue
        env:
           TESTCONTAINERS_RYUK_DISABLED: true
           GRADLE_ENTERPRISE_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
           GRADLE_ENTERPRISE_CACHE_USERNAME: ${{ secrets.GRADLE_ENTERPRISE_CACHE_USERNAME }}
           GRADLE_ENTERPRISE_CACHE_PASSWORD: ${{ secrets.GRADLE_ENTERPRISE_CACHE_PASSWORD }}
           PREDICTIVE_TEST_SELECTION: "${{ github.event_name == 'pull_request' && 'true' || 'false' }}"
      - name: Publish Test Report
        if: always()
        uses: mikepenz/action-junit-report@v6.2.0
        with:
          check_name: Java CI / Test Report (${{ matrix.java }})
          report_paths: '**/build/test-results/test/TEST-*.xml'
          check_retries: 'true'
